{% extends "base.html" %}{% block content %}<h2>All incidents</h2><input id="filter" placeholder="Search incidents" oninput="filterRows()"><div class="panel"><table id="incidents"><tr><th>ID</th><th>Title</th><th>Category</th><th>Severity</th><th>Status</th><th>Reporter</th><th>Update</th></tr>{% for r in incidents %}<tr><td>{{r[0]}}</td><td>{{r[1]}}</td><td>{{r[3]}}</td><td>{{r[4]}}</td><td>{{r[5]}}</td><td>{{r[6]}}</td><td><form method="post" action="{{ url_for('update_status',incident_id=r[0]) }}"><select name="status">{% for s in ['Open','Under Investigation','Resolved'] %}<option value="{{s}}" {% if s==r[5] %}selected{% endif %}>{{s}}</option>{% endfor %}</select><button>Save</button></form></td></tr>{% endfor %}</table></div><script>function filterRows(){const q=document.getElementById('filter').value.toLowerCase();document.querySelectorAll('#incidents tr:not(:first-child)').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}</script>{% endblock %}
