{% extends "base.html" %}{% block content %}<section class="panel"><h2>Report incident</h2><form method="post"><label>Title<input name="title" maxlength="100" required value="{{record.get('title','')}}"></label><label>Description<textarea name="description" maxlength="500">{{record.get('description','')}}</textarea></label><label>Category<select name="category" required>{% for c in ['Phishing','Malware','Unauthorized Access','Network Attack','Data Breach','Other'] %}<option value="{{c}}" {% if c==record.get('category') %}selected{% endif %}>{{c}}</option>{% endfor %}</select></label><label>Severity<select name="severity">{% for s in severities %}<option value="{{s}}">{{s}}</option>{% endfor %}</select></label><label>Reporter<input name="reporter" required value="{{record.get('reporter','')}}"></label><button>Save incident</button></form></section>{% endblock %}
